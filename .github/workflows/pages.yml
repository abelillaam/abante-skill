# Publishes the download website in site/ to GitHub Pages:
#   https://abelillaam.github.io/abante-skill/
# The page loads the latest release live, so it doesn't need redeploying
# for new app versions — only when the site itself changes.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

name: Deploy download site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
